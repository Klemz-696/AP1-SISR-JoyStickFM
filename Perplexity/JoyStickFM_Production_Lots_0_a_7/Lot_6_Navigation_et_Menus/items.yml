# --{ =-=-=-=-=-=-=-=-=-= ItemJoin's Custom Item Configurations, by RockinChaos =-=-=-=-=-=-=-=-=-= }--
# Modifying the Version will cause this file to break and regenerate.
items-Version: 8

# General options that apply to the custom items' functionality.
items-Delay: 2
items-Overwrite: true
items-Spamming: false
items-RestrictCount: false

# This is the section where the custom items created will be stored.
items:
  game-selector:
    id: COMPASS
    slot: 4
    name: '&6&l✦ MENU DES JEUX ✦ &7(Clic-Droit)'
    lore:
      - '&7Cliquez pour ouvrir la sélection des jeux :'
      - '&8▸ &aSurvie Vanilla'
      - '&8▸ &cBedWars &6Rush'
      - '&8▸ &eHikabrain &3Cache-Cache'
      - ''
      - '&e➜ Clic-droit pour ouvrir le menu'
    commands:
      - 'player: dm open games'
      - 'player: menu'
    commands-type: interact
    commands-sound: UI_BUTTON_CLICK
    itemflags: death-drops, self-drops, unbreakable, auto-remove
    triggers: join, respawn, world-switch
    enabled-worlds: hub, lobby_minijeux, bedwars_jfm, blockhunt_jfm, rush_jfm, hikabrain_jfm

  quit-lobby:
    id: RED_BED
    slot: 8
    name: '&c&l✦ RETOUR AU HUB ✦ &7(Clic-Droit)'
    lore:
      - '&7Cliquez pour quitter et retourner au Hub central.'
      - ''
      - '&c➜ Clic-droit pour retourner au Hub'
    commands:
      - 'player: spawn'
    commands-type: interact
    commands-sound: ENTITY_ENDERMAN_TELEPORT
    itemflags: death-drops, self-drops, unbreakable, auto-remove
    triggers: join, respawn, world-switch
    enabled-worlds: lobby_minijeux
