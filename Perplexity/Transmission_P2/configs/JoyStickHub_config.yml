parkour:
  enabled: true
  world: "lobby_minijeux_p2_candidate"
  # Blocs de départ : laine rouge native de la carte ou plaque de détection
  start_blocks:
    - "RED_WOOL"
    - "LIGHT_WEIGHTED_PRESSURE_PLATE"
  # Checkpoints intermédiaires : échelles natives, laine jaune/orange ou plaque
  checkpoint_blocks:
    - "LADDER"
    - "YELLOW_WOOL"
    - "HEAVY_WEIGHTED_PRESSURE_PLATE"
  # Blocs d'arrivée : laine violette du sommet, dalles de pierre, ou bloc d'émeraude
  finish_blocks:
    - "PURPLE_WOOL"
    - "EMERALD_BLOCK"
    - "SMOOTH_STONE_SLAB"
  finish_min_y: 72
  teleport_to_checkpoint_on_fall: true

combat:
  # Réduction maximale du délai de recharge des attaques (cooldown) dans l'arène Hikabrain
  # Permet le clic rapide (spam-click) sans altérer les autres mécaniques vanilla
  hikabrain_pvp_spam_cooldown_reduction: true
  hikabrain_attack_speed: 100.0

messages:
  prefix: "§6§lJoyStick FM §7» "
  void_rescue: "§eChute rattrapée ! Vous avez été repositionné au spawn."
  void_rescue_parkour: "§eChute de parkour ! Retour à votre dernier checkpoint."
  block_protect: "§cLa modification de blocs est interdite dans cette zone d'accueil !"
  parkour_start: "§a§lParkour commencé ! Bonne chance !"
  parkour_checkpoint: "§b✦ Checkpoint validé !"
  parkour_finish: "§6§l★ FÉLICITATIONS ! Parkour terminé en %time%s !"
