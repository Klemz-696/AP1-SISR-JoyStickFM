<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#b44fff" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M 20 30 
           A 20 20 0 0 0 10 50 
           A 20 20 0 0 0 30 70 
           L 35 70
           A 15 15 0 0 1 45 60
           L 55 60
           A 15 15 0 0 1 65 70
           L 70 70
           A 20 20 0 0 0 90 50 
           A 20 20 0 0 0 80 30 
           Z" 
        fill="none" 
        stroke="url(#neonGradient)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <path d="M 25 45 L 25 55 M 20 50 L 30 50" 
        stroke="#00f5ff" 
        stroke-width="4" 
        stroke-linecap="round"/>

  <circle cx="70" cy="55" r="3" fill="#b44fff" />
  <circle cx="80" cy="45" r="3" fill="#b44fff" />
  
  <rect x="42" y="48" width="6" height="3" fill="#c8c8d4" rx="1"/>
  <rect x="52" y="48" width="6" height="3" fill="#c8c8d4" rx="1"/>
</svg>